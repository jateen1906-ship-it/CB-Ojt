[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:identity-service]
directory=/app/services/identity-service
command=uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:project-service]
directory=/app/services/project-service
command=uvicorn app.main:app --host 127.0.0.1 --port 8002 --workers 1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:workspace-service]
directory=/app/services/workspace-service
command=uvicorn app.main:app --host 127.0.0.1 --port 8005 --workers 1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:payment-service]
directory=/app/services/payment-service
command=uvicorn app.main:app --host 127.0.0.1 --port 8008 --workers 1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:notification-service]
directory=/app/services/notification-service
command=uvicorn app.main:app --host 127.0.0.1 --port 8009 --workers 1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api-gateway]
directory=/app/api-gateway
command=uvicorn app.main:app --host 0.0.0.0 --port __PORT__ --workers 1 --proxy-headers --forwarded-allow-ips=*
autostart=true
autorestart=true
priority=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
