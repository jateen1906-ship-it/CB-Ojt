user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Map for WebSocket and standard HTTP connection upgrades
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Performance logging format with timing metrics
    log_format timed_combined '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for" '
                              'req_time=$request_time up_time=$upstream_response_time '
                              'up_addr=$upstream_addr up_status=$upstream_status';

    access_log /var/log/nginx/access.log timed_combined;

    # Kernel & TCP socket optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # High-concurrency client buffers and payload limits
    client_max_body_size 100M;
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;

    # Compression (Gzip) for maximum performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream pool for API Gateway cluster with least_conn balancing
    upstream api_gateway_cluster {
        least_conn;
        server api-gateway:8000 max_fails=3 fail_timeout=10s;
        server api-gateway-replica:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Docker internal DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=150r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=25r/s;

    server {
        listen 80 default_server;
        listen 8000;
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Enterprise OWASP Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Load Balancer Health Check Endpoint
        location = /lb-health {
            access_log off;
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"codebridge-load-balancer","algorithm":"least_conn","workers":"auto","upstreams":["api-gateway:8000","api-gateway-replica:8000"]}';
        }

        # Dedicated Auth endpoints with burst protection
        location ~ ^/(api/v1/auth|auth)(/|$) {
            limit_req zone=auth_limit burst=40 nodelay;

            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # API Gateway routes (Microservices proxying)
        location ~ ^/(api/|users|profile|freelancers|talent|projects|tasks|github|code-context|ai|workspace|reviews|verification|payments|notifications|admin|audit|observability|health|ready|docs|openapi\.json|redoc)(/|$) {
            limit_req zone=api_limit burst=150 nodelay;

            proxy_pass http://api_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Frontend microservices routing with fallback
        location / {
            set $frontend_upstream "http://frontend:3000";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_intercept_errors on;
            error_page 502 503 504 =200 /index.html;

            proxy_pass $frontend_upstream;
        }
    }
}
