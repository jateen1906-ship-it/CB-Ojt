apiVersion: 1

datasources:
  - name: CodeBridge-Projects
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: change_me_local_only
    jsonData:
      database: codebridge_project
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    isDefault: true
    editable: true

