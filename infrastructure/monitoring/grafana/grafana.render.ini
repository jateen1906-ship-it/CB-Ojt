# Grafana config for the public Render deployment (Dockerfile.grafana).
# Dashboards are embedded as iframes in the Vercel frontends, so anonymous
# visitors get read-only Viewer access. The datasource MUST use the
# restricted read-only DB role from grafana-readonly-role.sql.

[server]
root_url = %(protocol)s://%(domain)s/
enable_gzip = true

[security]
allow_embedding = true
cookie_secure = true
cookie_samesite = none
disable_gravatar = true
# admin password comes from GF_SECURITY_ADMIN_PASSWORD (Render env var)

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[auth]
disable_login_form = false

[users]
allow_sign_up = false
viewers_can_edit = false

[explore]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[snapshots]
enabled = false

[log]
mode = console
level = warn
